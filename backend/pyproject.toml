[project]
name = "vendor-dd"
version = "0.1.0"
description = "Vendor due-diligence agent powered by Tavily search/extract"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langchain-nebius>=0.1.0",
    "langchain-tavily>=0.2.0",
    "tavily-python>=0.5.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "trafilatura>=1.8.0",
]

[project.scripts]
vendor-dd = "vendor_dd.surfaces.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vendor_dd"]
